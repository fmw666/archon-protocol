name: sandbox-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cli-runner:
    name: Sandbox runner (CLI scenarios)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need a real ref so the auto-commit step can push.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build manifest + source pages
        run: npm run prebuild

      - name: Run sandbox runner (CLI scenarios)
        run: |
          node scripts/sandbox-run.mjs \
            --runnable=cli \
            --ci=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Continue even on failing scenarios — the JSON record itself is the
        # artefact we want committed/uploaded for the dashboard. The job's
        # final pass/fail is decided by the gate step below.
        continue-on-error: true

      - name: Run sandbox runner (agent scenarios → manual fallback)
        run: |
          node scripts/sandbox-run.mjs \
            --runnable=agent \
            --ci=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true

      - name: Upload run records as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-runs-${{ github.run_id }}
          path: docs/testing/sandbox/runs/
          retention-days: 30

      - name: Auto-commit refreshed run records (push / cron)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "archon-sandbox-bot"
          git config user.email "archon-sandbox-bot@users.noreply.github.com"
          git add docs/testing/sandbox/runs/
          if git diff --cached --quiet; then
            echo "No run-record changes to commit."
          else
            git commit -m "test(sandbox): refresh run records [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Comment on PR with summary diff (pull_request)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const idx = JSON.parse(fs.readFileSync('docs/testing/sandbox/runs/index.json', 'utf8'))
            const rows = Object.entries(idx.latest || {})
            const counts = { passing: 0, failing: 0, manual: 0 }
            for (const [, v] of rows) counts[v.result] = (counts[v.result] || 0) + 1
            const lines = ['### Sandbox runner — latest results', '']
            lines.push(`✅ ${counts.passing || 0} passing · ❌ ${counts.failing || 0} failing · ⏳ ${counts.manual || 0} manual`)
            lines.push('')
            lines.push('| test-id | result | manifest | runner | duration |')
            lines.push('|---------|--------|----------|--------|----------|')
            for (const [id, v] of rows.sort()) {
              const emoji = v.result === 'passing' ? '✅' : v.result === 'failing' ? '❌' : '⏳'
              lines.push(`| \`${id}\` | ${emoji} ${v.result} | ${v.manifest_version} | ${v.runner_kind} | ${v.duration_ms} ms |`)
            }
            const body = lines.join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            await github.rest.issues.createComment({ owner, repo, issue_number, body })

      - name: Gate on failing scenarios
        run: |
          node -e "
            const idx = JSON.parse(require('fs').readFileSync('docs/testing/sandbox/runs/index.json', 'utf8'))
            const failing = Object.entries(idx.latest || {}).filter(([, v]) => v.result === 'failing')
            if (failing.length > 0) {
              console.error('Sandbox runner reports', failing.length, 'failing scenario(s):')
              for (const [id, v] of failing) console.error('  -', id, '(' + v.runner_kind + ')')
              process.exit(1)
            }
            console.log('All recorded scenarios are passing or manual.')
          "
