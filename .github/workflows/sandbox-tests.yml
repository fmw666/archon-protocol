name: sandbox-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:00 UTC.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Scope:
#   This workflow exercises only the CLI runnable surface of the sandbox
#   harness (install / update / sync / uninstall scenarios driven by the
#   archon-cli Node entry-point). It does NOT drive the per-IDE agent SDKs
#   (Cursor, Claude, Codex, Aider) — those scenarios are runnable locally
#   via `npm run sandbox:agent` (see package.json) and tracked under
#   KNOWN-003 as a deliberate "verify locally, not in CI" decision.
#
#   Reasoning: agent SDKs require per-vendor API keys, billable model
#   calls, and slower wall-clock budgets. Bringing them into CI would
#   couple every PR to vendor uptime and secret-management, with no
#   regression payoff that the CLI scenarios + lint:dist + manifest
#   symmetry checks don't already cover at author time.

jobs:
  cli-runner:
    name: Sandbox runner (CLI scenarios)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need a real ref so the auto-commit step can push.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python (for archon-check.py inside cmd_zero assertions)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Build manifest + source pages
        run: npm run prebuild

      - name: Run sandbox runner (CLI scenarios)
        run: |
          node scripts/sandbox-run.mjs \
            --runnable=cli \
            --ci=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Continue even on failing scenarios — the JSON record itself is
        # the artefact we want committed/uploaded for the dashboard. The
        # job's final pass/fail is decided by the gate step below.
        continue-on-error: true

      - name: Upload run records as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-runs-${{ github.run_id }}
          path: docs/testing/sandbox/runs/
          retention-days: 30

      - name: Auto-commit refreshed run records (push / cron)
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "archon-sandbox-bot"
          git config user.email "archon-sandbox-bot@users.noreply.github.com"
          git add docs/testing/sandbox/runs/
          if git diff --cached --quiet; then
            echo "No run-record changes to commit."
          else
            git commit -m "test(sandbox): refresh run records [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Comment on PR with summary diff (pull_request)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const idx = JSON.parse(fs.readFileSync('docs/testing/sandbox/runs/index.json', 'utf8'))
            const rows = Object.entries(idx.latest || {})
            const counts = { passing: 0, failing: 0, manual: 0 }
            for (const [, v] of rows) counts[v.result] = (counts[v.result] || 0) + 1
            const lines = ['### Sandbox runner — latest results (CLI only)', '']
            lines.push(`✅ ${counts.passing || 0} passing · ❌ ${counts.failing || 0} failing · ⏳ ${counts.manual || 0} manual`)
            lines.push('')
            lines.push('_Agent-SDK scenarios are run locally only — see `npm run sandbox:agent`._')
            lines.push('')
            lines.push('| test-id | result | manifest | runner | provider | duration |')
            lines.push('|---------|--------|----------|--------|----------|----------|')
            for (const [id, v] of rows.sort()) {
              const emoji = v.result === 'passing' ? '✅' : v.result === 'failing' ? '❌' : '⏳'
              lines.push(`| \`${id}\` | ${emoji} ${v.result} | ${v.manifest_version} | ${v.runner_kind} | ${v.runner_provider || '—'} | ${v.duration_ms} ms |`)
            }
            const body = lines.join('\n')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            await github.rest.issues.createComment({ owner, repo, issue_number, body })

      - name: Gate on failing scenarios
        run: |
          node -e "
            const idx = JSON.parse(require('fs').readFileSync('docs/testing/sandbox/runs/index.json', 'utf8'))
            const failing = Object.entries(idx.latest || {}).filter(([, v]) => v.result === 'failing')
            if (failing.length > 0) {
              console.error('Sandbox runner reports', failing.length, 'failing scenario(s):')
              for (const [id, v] of failing) console.error('  -', id, '(' + v.runner_kind + ')')
              process.exit(1)
            }
            console.log('All recorded scenarios are passing or manual.')
          "
