<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archon Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo pixel">ARCHON</div>
  <nav class="sidebar-nav">
    <a class="sidebar-link sidebar-link--active" data-panel="workflow" href="#/">
      <span class="sidebar-icon">⚡</span>Workflow
    </a>
    <a class="sidebar-link" data-panel="timeline" href="#/timeline">
      <span class="sidebar-icon">📊</span>Timeline
    </a>
    <a class="sidebar-link" data-panel="knowledge" href="#/knowledge">
      <span class="sidebar-icon">🧠</span>Knowledge
    </a>
    <a class="sidebar-link" data-panel="debt" href="#/debt">
      <span class="sidebar-icon">🔴</span>Debt
    </a>
    <a class="sidebar-link" data-panel="memory" href="#/memory">
      <span class="sidebar-icon">💬</span>Memory
    </a>
    <a class="sidebar-link" data-panel="history" href="#/history">
      <span class="sidebar-icon">📜</span>History
    </a>
  </nav>
  <div class="sidebar-footer">
    <div class="sidebar-status" id="sidebar-status"></div>
  </div>
</aside>

<div class="main-area">
  <header class="topbar" id="topbar">
    <div class="topbar-stats">
      <div class="gauge" id="drift-gauge"></div>
      <div id="debt-badges"></div>
      <div id="milestone-badge"></div>
    </div>
    <div class="topbar-session" id="session-status"></div>
  </header>

  <div id="app">
    <div class="loading-state pixel">Loading governance state…</div>
  </div>
</div>

<!-- Slide-in panel overlay for sub-pages -->
<div class="slide-overlay" id="slide-overlay"></div>
<div class="slide-panel" id="slide-panel">
  <div class="slide-panel-header">
    <span class="slide-panel-title pixel" id="slide-panel-title"></span>
    <button class="slide-panel-close" id="slide-panel-close">✕</button>
  </div>
  <div class="slide-panel-body" id="slide-panel-body"></div>
</div>

<!-- Floating active-agent widget -->
<div class="agent-float" id="agent-float"></div>

<!-- Tooltip for SVG lines -->
<div id="wf-tip" class="wf-tip"></div>

<script src="/js/workflow-data.js"></script>
<script src="/js/components.js"></script>
<script src="/js/views.js"></script>
<script src="/js/views-trace.js"></script>
<script src="/js/workflow.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
